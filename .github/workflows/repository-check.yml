name: Repository Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  invoke:
    name: Invoke
    uses: DevExpress/github-actions/.github/workflows/repository-check.yml@repository-check
    with:
      config: |
        {
          ignoredAdvisories: [
            'GHSA-2gmp-34j9-fqjm', // replicator
            'GHSA-vfj7-8cjw-p6xm', // braces, no patch available, 2026-10-09
            'GHSA-g3hv-75wg-m249', // minimatch, no patch for 3.x and 5.x, 2026-11-02
          ]
        }
